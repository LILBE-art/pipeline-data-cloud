name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, tests and pipeline smoke run
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pipeline
          POSTGRES_PASSWORD: ci_throwaway_password
          POSTGRES_DB: ecommerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pipeline -d ecommerce_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_HOST: localhost
      TEST_POSTGRES_PORT: "5432"
      TEST_POSTGRES_DB: ecommerce_test
      TEST_POSTGRES_USER: pipeline
      TEST_POSTGRES_PASSWORD: ci_throwaway_password
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Tests (unit and PostgreSQL integration)
        run: pytest

      - name: Pipeline smoke run (files only)
        run: python -m src.main --skip-db

      - name: Pipeline smoke run (with PostgreSQL)
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: ecommerce_test
          POSTGRES_USER: pipeline
          POSTGRES_PASSWORD: ci_throwaway_password
        run: python -m src.main --load-db

  docker:
    name: Docker build and Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        env:
          POSTGRES_PASSWORD: ci_throwaway_password
        run: docker compose config --quiet

      - name: Build the image
        run: docker build -t pipeline-data-cloud:ci .
